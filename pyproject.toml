[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "microservice-relation-mapping"
version = "0.1.0"
description = "Deterministic evidence-based microservice relationship mapping."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "ruff==0.15.20",
  "ty==0.0.53",
]

[tool.hatch.build.targets.wheel]
packages = ["src/microservice_relation_mapping"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.12"
